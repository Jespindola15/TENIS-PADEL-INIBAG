name = "potrero-raqueta"
main = "worker/index.js"
compatibility_date = "2025-02-24"

# el juego se sirve desde la carpeta public/ (la arma src/build.py)
[assets]
directory = "./public"
binding = "ASSETS"

# una sala por partida
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
